        <div class="shot-frame single" data-zoom="${safeUrl(snapshot.src)}" data-caption="${escapeAttribute(snapshot.caption || snapshot.title || '')}">
          ${imageTag(snapshot.src, snapshot.title || 'Snapshot', '')}
        </div>
        <figcaption>${header}${snapshot.caption ? `<div class="shot-caption">${formatInline(snapshot.caption)}</div>` : ''}${source}${updateNotes(snapshot.updates)}</figcaption>
      </figure>`;
  }

  /** A storyboard: the large stage view, prev / play / next, and a filmstrip of every stage in build order. */
  function renderProgression(snapshot, header, source) {
    const progressionIndex = progressions.push(snapshot) - 1;
    const firstFrame = snapshot.frames[0];
    const filmstrip = snapshot.frames.map((frame, frameIndex) => `
      <button class="film-frame" type="button" data-stage="${frameIndex}" aria-current="${frameIndex === 0}" title="${escapeAttribute(frame.stage || '')}">
        <span class="film-step">${frameIndex + 1}</span>
        <img src="${safeUrl(frame.src)}" alt="" loading="lazy">
        <span class="film-label">${escapeHtml(frame.stage || `Stage ${frameIndex + 1}`)}</span>
      </button>`).join('');
    return `
      <figure class="card shot progression" data-progression="${progressionIndex}">
        <div class="shot-frame single" data-zoom="${safeUrl(firstFrame.src)}" data-caption="${escapeAttribute(firstFrame.stage || '')}">
          <img class="stage-image" src="${safeUrl(firstFrame.src)}" alt="${escapeAttribute(firstFrame.stage || 'Stage 1')}">
          <div class="shot-missing" hidden>Snapshot not found</div>
          <span class="stage-counter">Stage 1 / ${snapshot.frames.length}</span>
        </div>
        <div class="stage-controls">
          <button class="stage-button" type="button" data-step="-1" aria-label="Previous stage">◀</button>
          <button class="stage-button" type="button" data-play>▶ Play</button>
          <div class="stage-progress"><div style="width:${100 / snapshot.frames.length}%"></div></div>
          <button class="stage-button" type="button" data-step="1" aria-label="Next stage">▶</button>
        </div>
        <div class="stage-caption" aria-live="polite"></div>
        <div class="filmstrip">${filmstrip}</div>
        <figcaption>${header}${snapshot.caption ? `<div class="shot-caption">${formatInline(snapshot.caption)}</div>` : ''}${source}${updateNotes(snapshot.updates)}</figcaption>
      </figure>`;
  }

  function imageTag(src, alt, className) {
    if (!src) return '<div class="shot-missing">No snapshot</div>';
    return `<img class="${className}" src="${safeUrl(src)}" alt="${escapeAttribute(alt)}" loading="lazy" onerror="this.outerHTML='<div class=&quot;shot-missing&quot;>Snapshot not found:<br>${escapeAttribute(escapeAttribute(src))}</div>'">`;
  }

  function renderDecisions() {
    const decisions = report.decisions || [];
    const rows = decisions.map((decision) => `
      <div class="row">
        <div class="row-key">${escapeHtml(decision.id || '')}</div>
        <div>${formatInline(decision.text || '')} ${updatedBadge(decision.updates)}${decision.source ? `<div class="row-source">${formatInline(decision.source)}</div>` : ''}${updateNotes(decision.updates)}</div>
      </div>`).join('');
    return `
      <section id="decisions">
        <div class="section-head"><h2>Decisions made</h2><span class="section-note">The calls that shaped the build, and why</span></div>
        ${rows ? `<div class="card list-card">${rows}</div>` : '<div class="empty">No decisions recorded yet.</div>'}
      </section>`;
  }

  function renderFollowUps(allTasks) {
    const deferredRows = allTasks
      .filter((task) => task.status === 'deferred' || task.status === 'failed')
      .map((task) => `<div class="row"><div class="row-key">${escapeHtml(task.id || '')}</div><div><strong>${escapeHtml(task.title || '')}</strong>${task.deferredReason ? `<div class="row-source">${formatInline(task.deferredReason)}</div>` : ''}</div></div>`);
    const followUpRows = (report.followUps || [])
      .map((item, index) => `<div class="row"><div class="row-key">#${index + 1}</div><div>${formatInline(item)}</div></div>`);
    const rows = deferredRows.concat(followUpRows).join('');
    return `
      <section id="follow-ups">
        <div class="section-head"><h2>Deferred follow ups</h2><span class="section-note">What a human should look at next</span></div>
        ${rows ? `<div class="card list-card">${rows}</div>` : '<div class="empty">Nothing deferred, nothing outstanding.</div>'}
      </section>`;
  }

  function renderUpdateLog(allUpdates) {
    const rows = allUpdates
      .slice()
      .sort((first, second) => String(second.at || '').localeCompare(String(first.at || '')))
      .map((update) => `
        <div class="row">
          <div class="row-key">${escapeHtml(update.at || '')}${isNewTimestamp(update.at) ? ' <span class="updated-badge is-new">new</span>' : ''}</div>
          <div><a href="#${escapeAttribute(update.anchor)}">${escapeHtml(update.where)}</a>${update.by ? ` — by <strong>${escapeHtml(update.by)}</strong>` : ''}<div class="row-source">${formatInline(update.note || '')}</div></div>
        </div>`).join('');
    return `
      <section id="updates">
        <div class="section-head"><h2>Updates and revisions</h2><span class="section-note">Earlier results revised by later work — nothing is rewritten silently</span></div>
        ${rows ? `<div class="card list-card">${rows}</div>` : '<div class="empty">No earlier section has been revised.</div>'}
      </section>`;
  }

  /** While a run is going: what is being worked on this minute, and the milestones so far. */
  function renderCurrentActivity(allTasks) {
    const timeline = renderTimeline();
    return `
      <section id="current-activity">
        <div class="section-head"><h2>Current run activity</h2><span class="section-note">Live — this page refreshes itself whenever the run writes an update</span></div>
        ${renderNow(allTasks) || '<div class="empty">Run in progress — waiting for the first live update.</div>'}
        ${timeline ? `<div class="card recent-activity"><div class="recent-title">Milestones · newest first</div>${timeline}</div>` : ''}
      </section>`;
  }

  /** Once the run is over (or before it starts): the full milestone history, folded away. */
  function renderActivityLog() {
    const timeline = renderTimeline();
    const count = (report.activity || []).length;
    return `
      <section id="activity">
        <div class="section-head"><h2>Milestone activity logs</h2><span class="section-note">Every milestone of every run</span></div>
        ${timeline ? `<details class="card activity-log"><summary>Show all ${count} ${count === 1 ? 'entry' : 'entries'}, newest first</summary>${timeline}</details>` : '<div class="empty">No activity yet.</div>'}
      </section>`;
  }

  function renderTimeline() {
    const entries = (report.activity || []).slice().reverse();
    if (!entries.length) return '';
    return `<ol class="timeline">${entries.map((entry) => `
      <li class="${isNewTimestamp(entry.at) ? 'is-new' : ''}"><time>${escapeHtml(entry.at || '')}</time>${formatInline(entry.text || '')}</li>`).join('')}</ol>`;
  }

  /** "running" while a run is executing, "finished" once a run has ended (plan done or paused), else "planned". */
  function pageView() {
    const status = effectiveStatus();
    if (status === 'in-progress') return 'running';
    if (['paused', 'complete', 'incomplete'].includes(status)) return 'finished';
    if (status === 'specified') return 'specified';
    return 'planned';
  }


  function renderFooter() {
    return `<footer>Generated by the <a href="${SKILLS_DOWNLOAD_URL}" target="_blank" rel="noopener noreferrer">Babylon Toolkit Desktop Agent</a></footer>`;
  }

  function renderMissingData() {
    appRoot.innerHTML = `
      <main class="page">
        <div class="card error-panel">
          <h2>No dashboard data found</h2>
          <p>This page reads <code>documents/&lt;slug&gt;_dashboard.js</code> next to it. The file is missing, misnamed, or has a syntax error
          (open the browser console for details). bt-plan writes it when the plan is created, and bt-execute updates it after every phase.</p>
        </div>
      </main>`;
  }

  /** Shown instead of a blank page when the data parses but a field has a shape the page cannot render. */
  function renderBrokenData(error) {
    appRoot.innerHTML = `
      <main class="page">
        <div class="card error-panel">
          <h2>The dashboard data could not be shown</h2>
          <p>A field in <code>documents/&lt;slug&gt;_dashboard.js</code> has an unexpected shape: ${escapeHtml(error && error.message ? error.message : String(error))}.
          This page keeps checking and redraws itself as soon as the file is repaired (open the browser console for details).</p>
        </div>
      </main>`;
  }

  /* ===================== Data repair ===================== */

  /**
   * Repairs the list fields a hand or script slip most often breaks, so one bad value cannot blank the page:
   * an update written as plain text becomes one update note, and any other non-list value becomes an empty list.
   */
  function normalizeReport(data) {
    const asList = (value) => (Array.isArray(value) ? value : []);
    const asUpdates = (value) => {
      if (typeof value === 'string' && value) return [{ note: value }];
      return asList(value).map((update) => (typeof update === 'string' ? { note: update } : update)).filter((update) => update && typeof update === 'object');
    };
    // An image written under `path` (or `file`, `image`, `url`) instead of `src` would show "No snapshot": read it
    // from there and say so in the console, so the slip shows its picture and still gets fixed at the source.
    const imageKeys = ['path', 'file', 'image', 'url'];
    const repairImage = (image) => {
      if (!image || typeof image !== 'object' || image.src) return image;
      const wrongKey = imageKeys.find((key) => typeof image[key] === 'string' && image[key]);
      if (wrongKey) {
        console.warn(`Dashboard: a snapshot has its image under "${wrongKey}" instead of "src" (${image[wrongKey]}) — write snapshots with dashboard.mjs snapshot.`);
        image.src = image[wrongKey];
      }
      return image;
    };
    const repairSnapshots = (snapshots) => asList(snapshots)
      .filter((snapshot) => snapshot && typeof snapshot === 'object')
      .map((snapshot) => {
        repairImage(snapshot);
        repairImage(snapshot.before);
        repairImage(snapshot.after);
        return Object.assign(snapshot, { updates: asUpdates(snapshot.updates) }, snapshot.frames !== undefined ? { frames: asList(snapshot.frames).map(repairImage) } : {});
      });
    data.phases = asList(data.phases);
    // A decision written as plain text ("D3 — …") would render as an empty row: split off its id and show the text.
    const asDecision = (decision) => {
      if (typeof decision !== 'string') return decision;
      const match = decision.match(/^([A-Z]+\d+[a-z]?)(\s*\([^)]*\))?\s+[—–-]\s+([\s\S]*)$/);
      if (!match) return { id: '', text: decision };
      return { id: match[1], text: `${match[2] ? `${match[2].trim()} ` : ''}${match[3]}` };
    };
    data.decisions = asList(data.decisions).map(asDecision)
      .filter((decision) => decision && typeof decision === 'object')
      .map((decision) => Object.assign(decision, { updates: asUpdates(decision.updates) }));
    data.followUps = asList(data.followUps);
    data.activity = asList(data.activity);
    if (data.afterAction && typeof data.afterAction === 'object') {
      const afterAction = data.afterAction;
      afterAction.updates = asUpdates(afterAction.updates);
      afterAction.snapshots = repairSnapshots(afterAction.snapshots);
      ['body', 'highlights', 'sections'].forEach((key) => { if (afterAction[key] !== undefined) afterAction[key] = asList(afterAction[key]); });
      if (afterAction.planSummary !== undefined && typeof afterAction.planSummary !== 'string') delete afterAction.planSummary;
      if (afterAction.testing !== undefined) {
        if (afterAction.testing === null || typeof afterAction.testing !== 'object') afterAction.testing = null;
        else {
          afterAction.testing.suites = asList(afterAction.testing.suites).filter((suite) => suite && typeof suite === 'object');
          afterAction.testing.gaps = asTextList(afterAction.testing.gaps);
        }
      }
    }
    data.phases.forEach((phase) => {
      phase.updates = asUpdates(phase.updates);
      phase.snapshots = repairSnapshots(phase.snapshots);
      phase.tasks = asList(phase.tasks);
      phase.tasks.forEach((task) => {
        task.updates = asUpdates(task.updates);
        task.snapshots = repairSnapshots(task.snapshots);
        task.files = typeof task.files === 'string' ? [task.files] : asList(task.files);
        task.decisions = typeof task.decisions === 'string' ? [task.decisions] : asList(task.decisions);
        if (task.tests !== null && typeof task.tests !== 'object') task.tests = null;
        if (task.details !== null && task.details !== undefined && typeof task.details !== 'object') task.details = null;
        if (task.details) repairDetails(task.details);
      });
    });
    if (data.afterAction && Array.isArray(data.afterAction.sections)) {
      data.afterAction.sections.forEach((section) => {
        if (section && typeof section === 'object' && section.items !== undefined) section.items = asTextList(section.items);
      });
    }

    /** A verbose write-up: tables need lists of rows; notes may be one sentence or a list of them. */
    function repairDetails(details) {
      ['changes', 'testCases', 'acceptance', 'problems'].forEach((key) => {
        if (details[key] !== undefined) details[key] = asList(details[key]).filter((row) => row && typeof row === 'object');
      });
      if (details.notes !== undefined) details.notes = asTextList(details.notes);
      if (details.timing !== undefined && (details.timing === null || typeof details.timing !== 'object')) details.timing = null;
    }

    /** One string becomes a one-item list; a list keeps only its non-empty entries. */
    function asTextList(value) {
      if (typeof value === 'string') return value ? [value] : [];
      return asList(value).filter((item) => item !== null && item !== undefined && item !== '');
    }
  }

  /* ===================== Updated notifications ===================== */

  function updatedBadge(updates) {
    if (!updates || !updates.length) return '';
    const latest = updates[updates.length - 1];
    const label = `Updated${latest.at ? ` ${latest.at}` : ''}${latest.by ? ` · ${latest.by}` : ''}`;
    return `<span class="updated-badge ${isNew(updates) ? 'is-new' : ''}" title="${escapeAttribute(latest.note || '')}">${escapeHtml(label)}</span>`;
  }

  function updateNotes(updates) {
    if (!updates || !updates.length) return '';
    const items = updates.map((update) => `<li><span class="when">${escapeHtml(update.at || '')}${update.by ? ` · ${escapeHtml(update.by)}` : ''}</span>${formatInline(update.note || '')}</li>`).join('');
    return `<ul class="update-notes" aria-label="Updates">${items}</ul>`;
  }

  function isNew(updates) {
    return Boolean(updates && updates.some((update) => isNewTimestamp(update.at)));
  }

  /** Timestamps use "YYYY-MM-DD HH:MM", so plain string comparison orders them. */
  function isNewTimestamp(timestamp) {
    return Boolean(lastVisit && timestamp && String(timestamp) > lastVisit);
  }

  /* ===================== Data helpers ===================== */

  /* ===================== Run commands ===================== */


  /** The spec as bt-plan takes it, from the project root: `@.agents/specs/<slug>/documents/<slug>_spec.md`. */
  function specReference() {
    const slug = (report.feature && report.feature.slug) || '';
    const spec = (report.documents || []).find((document) => /spec/i.test(document.label || '') && document.path);
    const relativePath = spec ? String(spec.path).replace(/^\.?\//, '') : `documents/${slug}_spec.md`;
    // A legacy flat spec is linked as `../<slug>_spec.md`; fold the `..` into the path.
    const parts = [];
    for (const part of `.agents/specs/${slug}/${relativePath}`.split('/')) {
      if (part === '..') parts.pop();
      else if (part && part !== '.') parts.push(part);
    }
    return `@${parts.join('/')}`;
  }

  function planCommand(flags, brief = '') {
    const note = String(brief || '').trim().replace(/"/g, "'");
    return ['/bt-plan', ...flags, specReference(), note ? `"${note}"` : ''].filter(Boolean).join(' ');
  }

  function builtPlanCommand() {
    return planCommand(PLAN_OPTIONS.filter((option) => planChoice[option.key]).map((option) => option.flag), planChoice.brief);
  }

  /** Before a plan exists: the bt-plan commands that turn this spec into one. */
  function renderPlanCommands() {
    const parityByDefault = String((report.feature && report.feature.proof) || '').toLowerCase() === 'parity';
    const presets = [
      ['A standard plan', 'Ordered tasks with named tests, phases and a time estimate — the usual choice', planCommand([])],
      ['A heavy plan', 'Decision-complete: a Decisions log, a Design Reference and self-contained tasks — for a long run, fresh contexts or a cheaper model executing it', planCommand(['--heavy'])],
      parityByDefault
        ? ['A heavy plan with parity gates', 'This spec sets `proof: parity`, so every plan gets numeric parity gates — this one is decision-complete as well', planCommand(['--heavy', '--parity'])]
        : ['With numeric parity gates', 'Pixel thresholds and repeats against the reference instead of the default functional proof — slow', planCommand(['--parity'])],
      ['No time limit', 'Turns off TIME MATTERS, so the research can take as long as it needs', planCommand(['--no-time-limit'])],
    ];
    const rows = presets.map(([what, detail, command]) => `
      <div class="run-row">
        <div class="run-what"><strong>${escapeHtml(what)}</strong><span>${formatInline(detail)}</span></div>
        ${copyableCommand(command)}
      </div>`).join('');
    return `
      <section id="plan-commands">
        <div class="section-head"><h2>Plan this feature</h2><span class="section-note">Copy a command into your agent — bt-plan writes the plan and fills in this dashboard</span></div>
        <div class="card run-card">
          <div class="run-list">${rows}</div>
          <div class="run-builder">
            <div class="run-builder-title">Build your own</div>
            <div class="run-controls">
              <label class="run-field"><span>Brief</span>
                <input type="text" data-plan-choice="brief" value="${escapeAttribute(planChoice.brief)}" placeholder="Optional notes for the planner, e.g. mind the physics layer">
              </label>
              <div class="run-flags">${PLAN_OPTIONS.map((option) => `
                <label class="run-flag" title="${escapeAttribute(option.hint)}"><input type="checkbox" data-plan-choice="${option.key}"${planChoice[option.key] ? ' checked' : ''}> ${escapeHtml(option.label)}</label>`).join('')}
              </div>
            </div>
            <div class="run-built">${copyableCommand(builtPlanCommand(), 'built-plan-command')}</div>
          </div>
        </div>
      </section>`;
  }

  /** The commands show while there is work to start: a plan not yet run, or one paused part way. */
  function showsRunCommands(view) {
    return view === 'planned' || effectiveStatus() === 'paused';
  }

  /** The plan as bt-execute takes it, from the project root: `@.agents/specs/<slug>/documents/<slug>_plan.md`. */
  function planReference() {
    const slug = (report.feature && report.feature.slug) || '';
    const plan = (report.documents || []).find((document) => /plan/i.test(document.label || '') && document.path);
    const relativePath = plan ? String(plan.path).replace(/^\.?\//, '') : `documents/${slug}_plan.md`;
    return `@.agents/specs/${slug}/${relativePath}`;
  }

  function runCommand(flags, tasks) {
    return ['/bt-execute', ...flags, planReference(), tasks].filter(Boolean).join(' ');
  }

  /** A phase as a task range in plan order (`T4-T7`, or `T4` alone); ticked tasks inside it are skipped by bt-execute. */
  function phaseRange(phase) {
    const ids = (phase.tasks || []).map((task) => task.id).filter(Boolean);
    if (!ids.length) return '';
    return ids.length === 1 ? ids[0] : `${ids[0]}-${ids[ids.length - 1]}`;
  }

  function renderRunCommands(allTasks, view) {
    const starting = view === 'planned';
    const phases = (report.phases || []).filter((phase) => phaseRange(phase));
    const remaining = allTasks.filter((task) => task.status !== 'done' && task.status !== 'deferred');
    const nextTask = remaining[0];
    const nextPhase = phases.find((phase) => (phase.tasks || []).some((task) => task.status !== 'done' && task.status !== 'deferred'));
    const firstTask = allTasks[0];
    const phaseLabel = (phase) => `Phase ${phase.number} — ${phase.name || ''}`;

    const presets = starting
      ? [
        ['Every task, unattended', 'Auto-pilot builds and verifies each task in turn without stopping to ask, and commits nothing', runCommand(['--auto-pilot'], 'ALL')],
        ['Every task, with you on hand', 'Runs them all, and stops when it needs your decision', runCommand([], 'ALL')],
        nextPhase ? [`${phaseLabel(nextPhase)} only`, `Tasks ${phaseRange(nextPhase)}`, runCommand([], phaseRange(nextPhase))] : null,
        firstTask ? [`The first task only — ${firstTask.id}`, firstTask.title || '', runCommand([], firstTask.id)] : null,
        ['Every task, fully written up', 'Auto-pilot with --verbose: every task and the After Action Report documented in depth', runCommand(['--auto-pilot', '--verbose'], 'ALL')],
      ]
      : [
        ['Every remaining task, unattended', `${remaining.length} task${remaining.length === 1 ? '' : 's'} left, finished without stopping to ask`, runCommand(['--auto-pilot'], 'ALL')],
        nextTask ? [`The next task only — ${nextTask.id}`, nextTask.title || '', runCommand([], 'NEXT')] : null,
        remaining.length > 2 ? ['The next three tasks', remaining.slice(0, 3).map((task) => task.id).join(', '), runCommand([], 'NEXT:3')] : null,
        nextPhase ? [`Finish ${phaseLabel(nextPhase)}`, `Tasks ${phaseRange(nextPhase)}; the ticked ones are skipped`, runCommand([], phaseRange(nextPhase))] : null,
      ];

    const taskChoices = [
      ['ALL', 'All remaining tasks'],
      ['NEXT', 'The next unchecked task'],
      ['NEXT:3', 'The next three tasks'],
      ...phases.map((phase) => [phaseRange(phase), `${phaseLabel(phase)} (${phaseRange(phase)})`]),
      ...(starting ? allTasks : remaining).filter((task) => task.id).map((task) => [task.id, `${task.id} — ${task.title || ''}`]),
    ];
    if (!taskChoices.some(([value]) => value === runChoice.tasks)) runChoice.tasks = 'ALL';

    const rows = presets.filter(Boolean).map(([what, detail, command]) => `
      <div class="run-row">
        <div class="run-what"><strong>${escapeHtml(what)}</strong>${detail ? `<span>${formatInline(detail)}</span>` : ''}</div>
        ${copyableCommand(command)}
      </div>`).join('');

    return `
      <section id="run-commands">
        <div class="section-head"><h2>${starting ? 'Start this plan' : 'Continue this plan'}</h2><span class="section-note">Copy a command into your agent — ticked tasks are always skipped, so any of these is safe to run again</span></div>
        <div class="card run-card">
          <div class="run-list">${rows}</div>
          <div class="run-builder">
            <div class="run-builder-title">Build your own</div>
            <div class="run-controls">
              <label class="run-field"><span>Tasks</span>
                <select data-run-choice="tasks">${taskChoices.map(([value, label]) => `<option value="${escapeAttribute(value)}"${value === runChoice.tasks ? ' selected' : ''}>${escapeHtml(label)}</option>`).join('')}</select>
              </label>
              <div class="run-flags">${RUN_OPTIONS.map((option) => `
                <label class="run-flag" title="${escapeAttribute(option.hint)}"><input type="checkbox" data-run-choice="${option.key}"${runChoice[option.key] ? ' checked' : ''}> ${escapeHtml(option.label)}</label>`).join('')}
              </div>
            </div>
            <div class="run-built">${copyableCommand(builtCommand(), 'built-command')}</div>
          </div>
        </div>
      </section>`;
  }

  function builtCommand() {
    return runCommand(RUN_OPTIONS.filter((option) => runChoice[option.key]).map((option) => option.flag), runChoice.tasks);
  }

  function copyableCommand(command, id = '') {
    return `<div class="run-copy"><code class="run-command"${id ? ` id="${id}"` : ''}>${escapeHtml(command)}</code><button type="button" class="copy-command" data-copy="${escapeAttribute(command)}">Copy</button></div>`;
  }

  /** Copy buttons and the command builder; delegated, so they keep working after the page redraws. */
  function wireRunCommands() {
    document.addEventListener('click', (event) => {
      const button = event.target.closest('.copy-command');
      if (!button) return;
      const text = button.getAttribute('data-copy') || '';
      const copied = () => {
        button.textContent = 'Copied';
        button.classList.add('is-copied');
        setTimeout(() => { button.textContent = 'Copy'; button.classList.remove('is-copied'); }, 1500);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(copied, () => { copyWithSelection(text); copied(); });
      else { copyWithSelection(text); copied(); }
    });
    const updateBuilt = (event) => {
      const control = event.target.closest('[data-run-choice], [data-plan-choice]');
      if (!control) return;
      const forPlan = control.hasAttribute('data-plan-choice');
      const choice = forPlan ? planChoice : runChoice;
      choice[control.getAttribute(forPlan ? 'data-plan-choice' : 'data-run-choice')] = control.type === 'checkbox' ? control.checked : control.value;
      const command = forPlan ? builtPlanCommand() : builtCommand();
      const output = document.getElementById(forPlan ? 'built-plan-command' : 'built-command');
      if (output) {
        output.textContent = command;
        output.nextElementSibling.setAttribute('data-copy', command);
      }
    };
    document.addEventListener('change', updateBuilt);
    document.addEventListener('input', updateBuilt);
  }

  /** Where the clipboard API is unavailable, copy through a hidden selection; the command also stays visible to copy by hand. */
  function copyWithSelection(text) {
    const area = document.createElement('textarea');
    area.value = text;
    area.setAttribute('readonly', '');
    area.style.position = 'fixed';
    area.style.opacity = '0';
    document.body.appendChild(area);
    area.select();
    try { document.execCommand('copy'); } catch (error) { /* left for the user to copy by hand */ }
    area.remove();
  }

  function collectTasks() {
    return (report.phases || []).flatMap((phase) => phase.tasks || []);
  }

  /** Every update anywhere in the report, with where it lives, for the Updates section. */
  function collectUpdates() {
    const collected = [];
    const add = (updates, where, anchor) => (updates || []).forEach((update) => collected.push({ ...update, where, anchor }));
    if (report.afterAction) {
      add(report.afterAction.updates, 'After Action Report', 'after-action');
      (report.afterAction.snapshots || []).forEach((snapshot) => add(snapshot.updates, `After Action Report — ${snapshot.title || 'snapshot'}`, 'after-action'));
    }
    (report.phases || []).forEach((phase) => {
      const anchor = `phase-${phase.number}`;
      add(phase.updates, `Phase ${phase.number} — ${phase.name || ''}`, anchor);
      (phase.snapshots || []).forEach((snapshot) => add(snapshot.updates, `Phase ${phase.number} snapshot — ${snapshot.title || ''}`, anchor));
      (phase.tasks || []).forEach((task) => {
        add(task.updates, `${task.id} — ${task.title || ''}`, anchor);
        (task.snapshots || []).forEach((snapshot) => add(snapshot.updates, `${task.id} snapshot — ${snapshot.title || ''}`, anchor));
      });
    });
    (report.decisions || []).forEach((decision) => add(decision.updates, `Decision ${decision.id || ''}`, 'decisions'));
    return collected;
  }

  /* ===================== Formatting & safety ===================== */

  function escapeHtml(value) {
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function escapeAttribute(value) {
    return escapeHtml(value);
  }

  /** Escapes text, then allows `code` and **bold** — the only markup report text may use. */
  function formatInline(text) {
    return escapeHtml(text)
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  }

  /** Report links and images are relative paths inside the feature folder; anything with a scheme other than http(s) is dropped. */
  function cleanUrl(url) {
    const value = String(url || '').trim();
    return /^[a-z][a-z0-9+.-]*:/i.test(value) && !/^https?:/i.test(value) ? '#' : value;
  }

  /**
   * Where a recorded file path opens from this page. A path inside this feature's folder
   * (`.agents/specs/<slug>/tests/…`, or `tests/…`) opens relative to the page, so the link survives the folder being
   * moved to `.agents/complete/` or anywhere under `.agents/archived/`. Any other project path opens from the project root: the part of this page's address
   * before `/.agents/`.
   */
  function fileHref(file) {
    const value = String(file || '').trim().replace(/^\.\//, '');
    if (!value) return '#';
    if (/^[a-z][a-z0-9+.-]*:/i.test(value)) return cleanUrl(value);
    if (value.startsWith('/')) return `file://${value}`;
    const slug = report.feature && report.feature.slug;
    const ownFolder = /^\.agents\/(?:specs|complete|archived|archive)\/(?:[^/]+\/)*?([^/]+)\/(?=(?:tests|documents|snapshots|recon)\/)/.exec(value);
    if (ownFolder && (!slug || ownFolder[1] === slug)) return value.slice(ownFolder[0].length);
    if (/^(?:tests|documents|snapshots|recon)\//.test(value)) return value;
    const here = location.href.split(/[?#]/)[0];
    const agents = here.indexOf('/.agents/');
    return agents >= 0 ? here.slice(0, agents + 1) + value : `../../../${value}`;
  }

  /**
   * A recorded test file as a link that opens it in a new tab (a browser shows .js, .mjs, .json, .py, .cs as text).
   * A note after the path — `run-karting-tests.js (99)` — stays in the text but not in the link. An entry that is not
   * a path at all (`BtMarioKartWeb npm test (178)`, `$WEB tests (vitest)`) stays plain text rather than a dead link.
   */
  function fileLink(file) {
    const text = String(file || '');
    const target = text.trim().replace(/\s+\([^()]*\)\s*$/, '');
    if (!/^[^\s$]+\.[a-z0-9]+$/i.test(target)) return `<code>${escapeHtml(text)}</code>`;
    return `<a class="file-link" href="${escapeAttribute(fileHref(target))}" target="_blank" rel="noopener" title="Open ${escapeAttribute(target)}"><code>${escapeHtml(text)}</code></a>`;
  }

  /** `cleanUrl`, escaped for use inside an HTML attribute. */
  function safeUrl(url) {
    return escapeAttribute(cleanUrl(url));
  }

  /* ===================== Interaction ===================== */

  function animateRing(fraction) {
    const ring = document.getElementById('ring-value');
    if (!ring) return;
    const circumference = 2 * Math.PI * 52;
    ring.style.strokeDasharray = String(circumference);
    ring.style.strokeDashoffset = String(circumference);
    requestAnimationFrame(() => requestAnimationFrame(() => {
      ring.style.strokeDashoffset = String(circumference * (1 - fraction));
    }));
  }

  /** Seconds each stage stays on screen while a progression plays. */
  const PROGRESSION_PLAY_SECONDS = 2.2;

  function wireProgressions() {
    document.querySelectorAll('[data-progression]').forEach((figure) => {
      const snapshot = progressions[Number(figure.dataset.progression)];
      const frames = snapshot.frames;
      const stageFrame = figure.querySelector('.shot-frame');
      const stageImage = figure.querySelector('.stage-image');
      const missingNote = figure.querySelector('.shot-missing');
      const counter = figure.querySelector('.stage-counter');
      const progressFill = figure.querySelector('.stage-progress div');
      const caption = figure.querySelector('.stage-caption');
      const playButton = figure.querySelector('[data-play]');
      const filmstrip = figure.querySelector('.filmstrip');
      const filmButtons = Array.from(figure.querySelectorAll('.film-frame'));
      let currentStage = 0;
      let playTimer = null;

      const showStage = (stageIndex) => {
        currentStage = (stageIndex + frames.length) % frames.length;
        const frame = frames[currentStage];
        stageImage.src = cleanUrl(frame.src);
        stageImage.alt = frame.stage || `Stage ${currentStage + 1}`;
        stageFrame.dataset.zoom = cleanUrl(frame.src) || '#';
        stageFrame.dataset.caption = [frame.stage, frame.caption].filter(Boolean).join(' — ');
        counter.textContent = `Stage ${currentStage + 1} / ${frames.length}`;
        progressFill.style.width = `${((currentStage + 1) / frames.length) * 100}%`;
        caption.innerHTML = `
          <div class="stage-name">${formatInline(frame.stage || `Stage ${currentStage + 1}`)}${frame.task ? ` <span class="tag">${escapeHtml(frame.task)}</span>` : ''}${frame.at ? ` <span class="tag">${escapeHtml(frame.at)}</span>` : ''}</div>
          ${frame.caption ? `<div class="stage-note">${formatInline(frame.caption)}</div>` : ''}`;
        filmButtons.forEach((button, buttonIndex) => button.setAttribute('aria-current', String(buttonIndex === currentStage)));
        const activeButton = filmButtons[currentStage];
        const overflowsLeft = activeButton.offsetLeft < filmstrip.scrollLeft;
        const overflowsRight = activeButton.offsetLeft + activeButton.offsetWidth > filmstrip.scrollLeft + filmstrip.clientWidth;
        if (overflowsLeft || overflowsRight) filmstrip.scrollTo({ left: activeButton.offsetLeft - 16, behavior: 'smooth' });
      };

      const stopPlaying = () => {
        clearInterval(playTimer);
        playTimer = null;
        playButton.textContent = '▶ Play';
      };

      stageImage.addEventListener('load', () => { missingNote.hidden = true; stageImage.style.opacity = ''; fitFrameToImage(stageFrame, stageImage); });
      stageImage.addEventListener('error', () => { missingNote.hidden = false; stageImage.style.opacity = '0'; });
      figure.querySelectorAll('[data-step]').forEach((button) => button.addEventListener('click', () => {
        stopPlaying();
        showStage(currentStage + Number(button.dataset.step));
      }));
      filmButtons.forEach((button) => button.addEventListener('click', () => {
        stopPlaying();
        showStage(Number(button.dataset.stage));
      }));
      playButton.addEventListener('click', () => {
        if (playTimer) {
          stopPlaying();
          return;
        }
        playButton.textContent = '❚❚ Pause';
        if (currentStage === frames.length - 1) showStage(0);
        playTimer = setInterval(() => {
          if (currentStage === frames.length - 1) {
            stopPlaying();
            return;
          }
          showStage(currentStage + 1);
        }, PROGRESSION_PLAY_SECONDS * 1000);
      });
      showStage(0);
    });
  }

  function wireCompareSliders() {
    wireProgressions();
    document.querySelectorAll('.shot-frame.compare').forEach((frame) => {
      const slider = frame.querySelector('input[type="range"]');
      slider.addEventListener('input', () => frame.style.setProperty('--split', `${slider.value}%`));
      const afterImage = frame.querySelector('img:not(.before-layer)');
      if (afterImage) afterImage.addEventListener('load', () => fitFrameToImage(frame, afterImage));
    });
    document.querySelectorAll('.shot-frame.single img:not(.stage-image)').forEach((image) => {
      image.addEventListener('load', () => fitFrameToImage(image.parentElement, image));
    });
  }

  /** Matches the frame to the snapshot's own proportions so nothing is letterboxed. */
  function fitFrameToImage(frame, image) {
    if (image.naturalWidth && image.naturalHeight) {
      frame.style.aspectRatio = `${image.naturalWidth} / ${image.naturalHeight}`;
    }
  }

  function wireLightbox() {
    const lightbox = document.getElementById('lightbox');
    const lightboxImage = document.getElementById('lightbox-image');
    const lightboxCaption = document.getElementById('lightbox-caption');
    document.addEventListener('click', (event) => {
      const trigger = event.target.closest('[data-zoom]');
      if (!trigger || trigger.dataset.zoom === '#') return;
      lightboxImage.src = trigger.dataset.zoom;
      lightboxCaption.textContent = trigger.dataset.caption || '';
      lightbox.classList.add('is-open');
    });
    // A link to a task opens its card, not just scrolls to the folded row.
    document.addEventListener('click', (event) => {
      const link = event.target.closest('a[href^="#task-"]');
      const target = link && document.getElementById(decodeURIComponent(link.getAttribute('href').slice(1)));
      if (target && target.tagName === 'DETAILS') target.open = true;
    });
    const close = () => lightbox.classList.remove('is-open');
    lightbox.addEventListener('click', close);
    document.addEventListener('keydown', (event) => { if (event.key === 'Escape') close(); });
  }

  /** While a run is in progress the page reloads itself, so an open tab always shows the latest phase. */
  /**
   * Keeps an open tab current in every state: re-reads the data files in the background and reloads only when
   * something changed — a new task result, a finished run, a plan reopened with an added task, the next run starting.
   */
  function wireAutoUpdate() {
    const toggle = document.getElementById('live-toggle');
    if (toggle) {
      toggle.addEventListener('click', () => {
        writeStorage(localStorage, `${storageKey}:live`, isLiveEnabled() ? 'off' : 'on');
        toggle.setAttribute('aria-pressed', String(isLiveEnabled()));
        toggle.textContent = autoUpdateLabel();
      });
    }
    const dashboardSource = scriptSource('_dashboard.js');
    const liveSource = scriptSource('_live.js');
    const renderedFingerprint = fingerprint(report, live);
    const checkSeconds = pageView() === 'running' ? RUNNING_CHECK_SECONDS : IDLE_CHECK_SECONDS;
    setInterval(async () => {
      if (!isLiveEnabled() || document.querySelector('.lightbox.is-open')) return;
      const nextReport = await reloadGlobal(dashboardSource, 'FEATURE_DASHBOARD');
      if (!nextReport) return; // missing or caught mid-write — try again next time
      const nextLive = liveSource ? await reloadGlobal(liveSource, 'FEATURE_LIVE') : null;
      if (fingerprint(nextReport, nextLive) === renderedFingerprint) return;
      writeStorage(sessionStorage, `${storageKey}:scroll`, String(window.scrollY));
      location.reload();
    }, checkSeconds * 1000);
    setInterval(refreshAges, AGE_REFRESH_SECONDS * 1000);
  }

  function autoUpdateLabel() {
    return `Auto-update ${isLiveEnabled() ? 'on' : 'off'}`;
  }

  function scriptSource(suffix) {
    const script = Array.from(document.scripts).find((candidate) => (candidate.getAttribute('src') || '').endsWith(suffix));
    return script ? script.getAttribute('src') : '';
  }

  /** Loads a data file again from disk (the query string defeats the cache) and returns the global it assigns. */
  function reloadGlobal(source, globalName) {
    return new Promise((resolve) => {
      window[globalName] = undefined;
      const script = document.createElement('script');
      script.src = `${source}?check=${Date.now()}`;
      script.onload = () => { script.remove(); resolve(window[globalName] || null); };
      script.onerror = () => { script.remove(); resolve(null); };
      document.head.appendChild(script);
    });
  }

  function fingerprint(dashboardData, liveData) {
    return JSON.stringify([dashboardData, liveData || null]);
  }

  /** Re-words every "updated N min ago" label as time passes, without reloading the page. */
  function refreshAges() {
    document.querySelectorAll('[data-age]').forEach((label) => {
      const age = describeAge(label.dataset.age);
      label.textContent = age.text;
      const card = label.closest('.now');
      if (card) card.classList.toggle('is-stale', age.isStale);
    });
  }

  /**
   * The status the page acts on. The data's `status` is written by bt-execute, but "complete" is only believed
   * when every task really is done; otherwise the plan is shown as paused, with a warning in the header.
   */
  function effectiveStatus() {
    const status = report.status || 'planned';
    // A dashboard still marked specified once a plan has filled in its tasks is planned.
    if (status === 'specified' && collectTasks().length) return 'planned';
    if (status === 'complete' && unfinishedTasks().length) return 'paused';
    return status;
  }

  function unfinishedTasks() {
    return collectTasks().filter((task) => task.status !== 'done');
  }

  function isLiveEnabled() {
    return readStorage(localStorage, `${storageKey}:live`) !== 'off';
  }

  function restoreScroll() {
    const savedScroll = readStorage(sessionStorage, `${storageKey}:scroll`);
    if (savedScroll == null) return;
    document.documentElement.style.scrollBehavior = 'auto';
    window.scrollTo(0, Number(savedScroll) || 0);
    document.documentElement.style.scrollBehavior = '';
    writeStorage(sessionStorage, `${storageKey}:scroll`, null);
  }

  /** Browser storage can be blocked for file:// pages; the report works without it. */
  function readStorage(storage, key) {
    try {
      return storage.getItem(key);
    } catch (error) {
      return null;
    }
  }

  function writeStorage(storage, key, value) {
    try {
      if (value == null) storage.removeItem(key);
      else storage.setItem(key, value);
    } catch (error) {
      /* storage unavailable — live toggle and "new" markers simply reset */
    }
  }
})();
</script>
</body>
</html>
